name: Poll JobSpy (Indeed + LinkedIn)

on:
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: poll-jobspy
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run JobSpy poller
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 jobspy_poller.py

      - name: Commit updated state
        run: python3 sync_state.py "Update seen jobspy postings [skip ci]" state/seen_jobspy.json state/notified.json
