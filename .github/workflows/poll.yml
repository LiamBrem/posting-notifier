name: Poll job boards

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: poll-job-boards
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run poller
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 poller.py

      - name: Commit updated state
        run: python3 sync_state.py "Update seen postings [skip ci]" state/seen.json state/notified.json
